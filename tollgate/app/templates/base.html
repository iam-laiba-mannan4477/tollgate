<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Tollgate{% endblock %} · Tollgate</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/countdown.js" defer></script>
</head>
<body>
{% if demo %}
<div class="demo-banner" role="alert">DEMO MODE: fake demo account, fake secret, test money only. Not for real use.</div>
{% endif %}
<header class="top">
  <strong class="brand">Tollgate</strong>
  <span class="tag">Sandbox only · fake money</span>
  {% if user %}
  <nav>
    <a href="/approvals">Approvals</a>
    <a href="/audit">Audit log</a>
    <a href="/setup">Authenticator</a>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit" class="link">Log out ({{ user }})</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
